[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotabyss-local-server"
version = "0.1.0"
description = "Local Android protocol adapter and fixture-backed Dot Abyss server"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "msgpack>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
dotabyss-server = "dotabyss_ps.app:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
pythonpath = ["server", "."]
testpaths = ["tests"]
